server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Keeping these proxies here means the UI also works when the frontend
    # Service is port-forwarded directly, without involving Ingress.
    location /api/ {
        proxy_pass http://taskboard-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://taskboard-api:8080;
    }
}
