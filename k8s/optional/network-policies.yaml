# Apply this only after the base application is healthy.
# NetworkPolicy enforcement depends on the CNI used by your cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: taskboard
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-traffic
  namespace: taskboard
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [taskboard-api, taskboard-frontend]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-api-and-db-check
  namespace: taskboard
spec:
  podSelector:
    matchLabels:
      app: taskboard-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: taskboard-api
        - podSelector:
            matchLabels:
              app: taskboard-db-check
      ports:
        - protocol: TCP
          port: 5432
