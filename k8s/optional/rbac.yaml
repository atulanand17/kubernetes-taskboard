apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskboard-reader
  namespace: taskboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taskboard-pod-reader
  namespace: taskboard
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taskboard-pod-reader
  namespace: taskboard
subjects:
  - kind: ServiceAccount
    name: taskboard-reader
    namespace: taskboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: taskboard-pod-reader
