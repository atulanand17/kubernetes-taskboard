apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard
spec:
  ingressClassName: nginx
  rules:
    - host: taskboard.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: taskboard-api
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: taskboard-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskboard-frontend
                port:
                  number: 8080
